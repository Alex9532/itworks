<!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML 2.0//EN">
<html><head>
<title>404 Not Found</title>
</head><body>
<h1>Not Found</h1>
<p>The requested URL <span id="path">/</span> was not found on this server.</p>
<hr>
<address>Apache/<span id="ver">2.4.69</span> (Fedora) Server at <span id="host">example.com</span> Port <span id="port">80</span></address>
<script>
  document.getElementById("path").textContent = window.location.pathname || "/";
  document.getElementById("host").textContent = window.location.hostname || "this web site on";
  document.getElementById("port").textContent = window.location.port || (window.location.protocol === "https:" ? "443" : "80");

  (function() {
    var verEl = document.getElementById("ver");
    var cached = localStorage.getItem("apache_latest_ver");
    if (cached) { verEl.textContent = cached; }

    fetch("https://api.github.com.", {
      headers: { "Accept": "application/vnd.github.v3+json" }
    })
      .then(function(res) { return res.ok ? res.json() : Promise.reject(); })
      .then(function(refs) {
        var versions = [];
        for (var i = 0; i < refs.length; i++) {
          var name = refs[i].ref.replace("refs/tags/", "");
          if (/^\d+\.\d+\.\d+$/.test(name)) {
            versions.push(name);
          }
        }
        if (versions.length > 0) {
          versions.sort(function(a, b) {
            return a.localeCompare(b, undefined, { numeric: true });
          });
          var latest = versions[versions.length - 1];
          verEl.textContent = latest;
          localStorage.setItem("apache_latest_ver", latest);
        }
      })
      .catch(function(){});
  })();
</script>
</body></html>
